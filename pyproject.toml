[project]
name = "rag-masterclass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "souravdw91-star", email = "sourav.dw91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "notebook>=7.6.3",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-masterclass = "rag_masterclass:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
